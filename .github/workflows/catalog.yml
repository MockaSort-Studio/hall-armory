name: Validate catalog

on:
  pull_request:
    paths:
      [
        "manifest.json",
        "collaboration/**",
        "lib/**",
        "tests/**",
        "package.json",
      ]
  push:
    branches: [main]
    paths:
      [
        "manifest.json",
        "collaboration/**",
        "lib/**",
        "tests/**",
        "package.json",
      ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:catalog
