name: Cache one suite for one guest system

# Reusable chain: build a suite's Linux guest output on a matching runner, push it
# to Cachix (push=true only), then prove a client OS can fetch it without building.

on:
  workflow_call:
    inputs:
      package: { description: Suite path, required: true, type: string }
      system: { description: Nix guest system, required: true, type: string }
      build-runner: { required: true, type: string }
      verify-runner: { required: true, type: string }
      push: { description: Upload to the cache and verify, required: true, type: boolean }
    secrets:
      CACHIX_AUTH_TOKEN: { required: false }

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.build-runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v19
      - uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ !inputs.push }}
      - run: bash scripts/cache-suite.sh "${{ inputs.package }}" "${{ inputs.system }}"
      - name: Run on a stand-in for the Gondolin guest (Alpine/musl, Node 24)
        run: bash scripts/test-guest-compat.sh "${{ inputs.package }}" "${{ inputs.system }}"

  # --max-jobs 0 forbids local builds, so this fails unless the cache holds the
  # complete closure; the flake reference is the one a Hall client uses.
  verify:
    if: inputs.push
    needs: build
    runs-on: ${{ inputs.verify-runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v19
      - uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
      - run: bash scripts/cache-suite.sh "${{ inputs.package }}" "${{ inputs.system }}" --max-jobs 0
        env:
          FLAKE_BASE: github:${{ github.repository }}/${{ github.sha }}
