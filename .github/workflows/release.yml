name: Release affected packages

on:
  workflow_dispatch:
    inputs:
      base:
        description: Commit or tag before the changes to release
        required: true
        type: string
      publish:
        description: Publish packages and create releases; false performs a dry run.
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.filter.outputs.matched-items }}
      any: ${{ steps.filter.outputs.matched }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: items
        run: echo "items=$(node scripts/catalog-items.mjs)" >> "$GITHUB_OUTPUT"
      - uses: MockaSort-Studio/actions/.github/actions/changes-filter@main
        id: filter
        with:
          base: ${{ inputs.base }}
          head: ${{ github.sha }}
          items: ${{ steps.items.outputs.items }}
  release:
    needs: discover
    if: needs.discover.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - id: version
        name: Check npm package version
        env:
          ID: ${{ matrix.package.id }}
          PATH: ${{ matrix.package.path }}
        run: |
          version=$(node -p "require('./'$PATH'/package.json').version")
          if npm view "$ID@$version" version >/dev/null 2>npm-view.err; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$ID@$version already exists on npm; skipping release."
          elif grep -q 'E404' npm-view.err; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            cat npm-view.err >&2
            exit 1
          fi
      - run: bash scripts/test-package.sh "${{ matrix.package.path }}"
      - name: Verify package publication
        if: ${{ steps.version.outputs.publish == 'true' && !inputs.publish }}
        run: npm publish "${{ matrix.package.path }}" --access public --dry-run
      - name: Publish package
        if: ${{ steps.version.outputs.publish == 'true' && inputs.publish }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "${{ matrix.package.path }}" --access public
      - name: Create GitHub release
        if: ${{ steps.version.outputs.publish == 'true' && inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ matrix.package.id }}
          PATH: ${{ matrix.package.path }}
        run: |
          version=$(node -p "require('./'$PATH'/package.json').version")
          tag="${ID#*/}-v$version"
          gh release create "$tag" --target "$GITHUB_SHA" --generate-notes --title "$tag"
