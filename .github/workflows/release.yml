name: Release GitHub extension

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version declared by extensions/collaboration/github/package.json
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Verify requested version
        env:
          VERSION: ${{ inputs.version }}
        run: test "$(node -p "require('./extensions/collaboration/github/package.json').version")" = "$VERSION"
      - run: npm run test:github
      - name: Publish package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish ./extensions/collaboration/github --access public
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: github-v${{ inputs.version }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --generate-notes --title "$TAG"
