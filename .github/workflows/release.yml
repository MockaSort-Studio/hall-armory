name: Stage affected packages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        description: Commit or tag before the changes to stage
        required: true
        type: string
      publish:
        description: Stage packages for npm approval; false performs a dry run.
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.filter.outputs.matched-items }}
      any: ${{ steps.filter.outputs.matched }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: items
        run: echo "items=$(node scripts/catalog-items.mjs)" >> "$GITHUB_OUTPUT"
      - uses: MockaSort-Studio/actions/.github/actions/changes-filter@main
        id: filter
        with:
          base: ${{ github.event.before || inputs.base }}
          head: ${{ github.sha }}
          items: ${{ steps.items.outputs.items }}
  release:
    needs: discover
    if: needs.discover.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          registry-url: https://registry.npmjs.org
          cache: npm
      - uses: DeterminateSystems/nix-installer-action@v19
      - run: npm ci
      - id: version
        name: Check npm package version
        env:
          ID: ${{ matrix.package.id }}
          PACKAGE_PATH: ${{ matrix.package.path }}
        run: |
          version=$(jq -r .version "$PACKAGE_PATH/package.json")
          if npm view "$ID@$version" version >/dev/null 2>npm-view.err; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$ID@$version already exists on npm; skipping release."
          elif grep -q 'E404' npm-view.err; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            cat npm-view.err >&2
            exit 1
          fi
      - run: bash scripts/test-package.sh "${{ matrix.package.path }}"
      - run: bash scripts/test-nix-closure.sh "${{ matrix.package.path }}"
      - name: Verify staged publication
        if: ${{ steps.version.outputs.publish == 'true' && github.event_name == 'workflow_dispatch' && !inputs.publish }}
        run: npx --yes npm@12.1.0 stage publish "${{ matrix.package.path }}" --access public --dry-run
      - name: Stage package for approval
        if: ${{ steps.version.outputs.publish == 'true' && (github.event_name == 'push' || inputs.publish) }}
        run: npx --yes npm@12.1.0 stage publish "${{ matrix.package.path }}" --access public
