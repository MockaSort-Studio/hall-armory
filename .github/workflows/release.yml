name: Stage affected packages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        description: Commit or tag before the changes to stage
        required: true
        type: string
      publish:
        description: Stage packages for npm approval; false performs a dry run.
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.filter.outputs.matched-items }}
      any: ${{ steps.filter.outputs.matched }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: items
        run: echo "items=$(node scripts/catalog-items.mjs)" >> "$GITHUB_OUTPUT"
      - uses: MockaSort-Studio/actions/.github/actions/changes-filter@main
        id: filter
        with:
          base: ${{ github.event.before || inputs.base }}
          head: ${{ github.sha }}
          items: ${{ steps.items.outputs.items }}
  release:
    needs: discover
    if: needs.discover.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}
    # Verifying a package, checking its version against npm and staging it for approval is shared with the
    # other MockaSort packages: see MockaSort-Studio/actions (release-npm). A push stages; a manual run only
    # stages when `publish` is true and otherwise performs a dry run.
    permissions:
      contents: read
      id-token: write
    uses: MockaSort-Studio/actions/.github/workflows/release-npm.yml@main
    with:
      package-path: ${{ matrix.package.path }}
      mode: ${{ (github.event_name == 'push' || inputs.publish) && 'publish' || 'dry-run' }}
      node-version: 22.22.2
      setup-nix: "true"
      test-command: |
        bash scripts/test-package.sh "$PACKAGE_PATH"
        bash scripts/test-nix-closure.sh "$PACKAGE_PATH"
