name: Test affected packages

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.filter.outputs.matched-items }}
      any: ${{ steps.filter.outputs.matched }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: items
        run: echo "items=$(node scripts/catalog-items.mjs)" >> "$GITHUB_OUTPUT"
      - uses: MockaSort-Studio/actions/.github/actions/changes-filter@main
        id: filter
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
          head: ${{ github.sha }}
          items: ${{ steps.items.outputs.items }}
  test:
    needs: discover
    if: needs.discover.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bash scripts/test-package.sh "${{ matrix.package.path }}"
