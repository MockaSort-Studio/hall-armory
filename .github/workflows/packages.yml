name: Test affected packages

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.filter.outputs.matched-items }}
      any: ${{ steps.filter.outputs.matched }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: items
        run: echo "items=$(node scripts/catalog-items.mjs)" >> "$GITHUB_OUTPUT"
      - uses: MockaSort-Studio/actions/.github/actions/changes-filter@main
        id: filter
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
          head: ${{ github.sha }}
          items: ${{ steps.items.outputs.items }}
  test:
    needs: discover
    if: needs.discover.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: DeterminateSystems/nix-installer-action@v19
      - run: npm ci
      - run: bash scripts/test-package.sh "${{ matrix.package.path }}"
      - run: bash scripts/test-nix-closure.sh "${{ matrix.package.path }}"

  # Publish each affected suite's Linux guest output after its tests pass. The
  # guest matches the host architecture: x86_64 covers Linux and Intel Macs,
  # aarch64 covers Apple silicon (verified on macOS). Pull requests build only.
  cache-x86_64:
    needs: [discover, test]
    if: needs.discover.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}
    uses: ./.github/workflows/cache-system.yml
    with:
      package: ${{ matrix.package.path }}
      system: x86_64-linux
      build-runner: ubuntu-24.04
      verify-runner: ubuntu-24.04
      push: ${{ github.event_name == 'push' }}
    secrets: inherit
  cache-aarch64:
    needs: [discover, test]
    if: needs.discover.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}
    uses: ./.github/workflows/cache-system.yml
    with:
      package: ${{ matrix.package.path }}
      system: aarch64-linux
      build-runner: ubuntu-24.04-arm
      verify-runner: macos-latest
      push: ${{ github.event_name == 'push' }}
    secrets: inherit
